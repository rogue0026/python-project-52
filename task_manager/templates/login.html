{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
<div class="container">
    <main class="form-signin w-25 m-auto">
    <form action="{% url 'login_view' %}" method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Войти" %}
    </form>
    </main>
</div>
{% endblock %}
