{% extends "base.html" %}
{% block content %}
<div class="container">
    <main class="form-signin w-25 m-auto">
        <form action="{% url 'tasks_delete_view' task_id %}" method="post">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal">Удаление задачи</h1>
            <p>Вы действительно хотите удалить {{ task_name }}?</p>
            <button class="btn btn-danger w-100" type="submit">Удалить</button>
        </form>
    </main>
</div>
{% endblock %}
