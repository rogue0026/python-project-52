<main class="form-signin m-auto mb-5">
    <form method="get" action="{% url 'tasks_list_view' %}">
        {% csrf_token %}
        {% for field in task_filter.form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
            </div>
        {% endfor %}
        <button class="btn btn-primary mt-2" type="submit">Показать</button>
    </form>
</main>
