<main class="form-signin m-auto mb-5">
    <form method="get" action="{% url 'tasks_list_view' %}">
        {% csrf_token %}
        <h1 class="h3 mb-3 fw-normal">Фильтр</h1>
        {% for field in tasks_filter.form %}
            <div class="form-group">
                <label for="id_{{ field.name }}">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button class="btn btn-primary mt-2" type="submit">Показать</button>
    </form>
</main>
