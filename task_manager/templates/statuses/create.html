{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
    <main class="form-signin w-50 m-auto">
        <form method="post" action="{% url 'statuses_create_view' %}">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal">Создать статус</h1>
            {% bootstrap_form form %}
            {% bootstrap_button button_type="submit" content="Создать" %}
        </form>
    </main>
{% endblock %}
