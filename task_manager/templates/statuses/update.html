{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
    <main class="form-signin w-50 m-auto">
        <form method="post" action="{% url 'statuses_update_view' status.id %}">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal">Изменение статуса</h1>
            {% bootstrap_form form %}
            {% bootstrap_button button_type="submit" content="Изменить" %}
        </form>
    </main>

{% endblock %}
