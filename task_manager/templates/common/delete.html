{% extends "base.html" %}
{% block content %}
<div class="container">
    <main class="form-signin w-25 m-auto">
        <form action="{% url view_name view.kwargs.pk %}" method="post">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal">{{ header_name }}</h1>
            <p>Вы действительно хотите удалить {{ object }}?</p>
            <button class="btn btn-danger w-100" type="submit">Да, удалить</button>
        </form>
    </main>
</div>
{% endblock %}
