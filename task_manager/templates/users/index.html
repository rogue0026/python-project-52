{% extends "base.html" %}
{% block content %}
    <div class="container w-75">
        <table class="table table-hover table-bordered">
        <thead>
            <th>ID</th>
            <th>Имя пользователя</th>
            <th>Полное имя</th>
            <th>Дата создания</th>
            <th>Действия</th>
        </thead>
        <tbody>
            {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.username }}</td>
                    <td>{{ user.full_name }}</td>
                    <td>{{ user.date_joined }}</td>
                    <td class="text-center">
                        <a href="{% url 'update_view' user.id %}">Изменить</a>
                        <br>
                        <a href="{% url 'delete_view' user.id %}">Удалить</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
        </table>
    </div>
{% endblock %}
