{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
<div class="container">
    <main class="form-signin w-50 m-auto">
        <form method="post" action="{% url 'registration_view' %}">
            {% csrf_token %}
            {% bootstrap_form form %}
            {% bootstrap_button button_type="submit" content="Зарегистрировать" %}
        </form>
    </main>
</div>
{% endblock %}
