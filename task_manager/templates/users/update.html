{% extends "base.html" %}
{% block content %}
<div class="container">
    <main class="form-signin w-50 m-auto">
        <form method="post" action="{% url 'users_update_view' user_id %}">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal">Редактирование данных пользователя</h1>
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                    {% for error in field.errors %}
                        <p class="text-danger">{{ error }}</p>
                    {% endfor %}
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Обновить</button>
        </form>
    </main>
</div>
{% endblock %}
