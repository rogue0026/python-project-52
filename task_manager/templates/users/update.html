{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
<div class="container">
    <main class="form-signin w-50 m-auto">
        <form method="post" action="{% url 'users_update_view' request.user.id %}">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal">Редактирование данных пользователя</h1>
            {% bootstrap_form form %}
            {% bootstrap_button button_type="submit" content="Изменить" %}
        </form>
    </main>
</div>
{% endblock %}
